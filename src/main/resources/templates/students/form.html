<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>UBIAN - Formulár</title>
</head>
<body>
<h2 th:text="${student.id} != null ? 'UBIAN - Upraviť existujúceho študenta' : 'UBIAN - Pridať nového študenta'"></h2>

<form th:action="${student.id} != null ? @{/students/{id}(id=${student.id})} : @{/students}"
      th:object="${student}" method="post">

    <p>Meno: <input type="text" id="firstName" th:field="*{firstName}" placeholder="Zadajte Vaše meno" required></p>
    <p>Priezvisko: <input type="text" id="lastName" th:field="*{lastName}" placeholder="Zadajte Vaše priezvisko" required></p>
    <p>Dátum narodenia: <input type="date" id="birthDate" th:field="*{birthDate}" required></p>

    <p>Pohlavie:
        <select id="gender" th:field="*{gender}" required>
            <option value="" disabled selected>Vyberte si pohlavie</option>
            <option value="MALE">Muž</option>
            <option value="FEMALE">Žena</option>
        </select>
    </p>

    <p>Email: <input type="email" id="email" th:field="*{email}" placeholder="Vložte Vašu emailovú adresu" required></p>
    <p>Telefón: <input type="tel" id="phone" th:field="*{phone}" placeholder="Zadajte svoje telefónne číslo"></p>
    <p>Kredit: <input type="number" step="0.01" id="credit" th:field="*{credit}" placeholder="Zadajte kredit" required></p>

    <a th:href="@{/students}">Späť na zoznam</a>
    <button type="submit" th:text="${student.id} != null ? 'Upraviť študenta' : 'Pridať študenta'"></button>
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adresár zamestnancov</title>
    <!-- Pridanie Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Zoznam zamestnancov</h2>
        <a th:href="@{/employees/create}" class="btn btn-success">Pridať zamestnanca</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Meno</th>
                    <th>Priezvisko</th>
                    <th>Pozícia</th>
                    <th>Typ úväzku</th>
                    <th class="text-center">Akcia</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employees}">
                    <td class="align-middle" th:text="${employee.firstName}"></td>
                    <td class="align-middle" th:text="${employee.lastName}"></td>
                    <td class="align-middle" th:text="${employee.jobTitle}"></td>
                    <td class="align-middle">
                        <span class="badge bg-info text-dark" th:text="${employee.fullTime}"></span>
                    </td>
                    <td class="text-center align-middle">
                        <form th:action="@{'/employees/' + ${employee.id}}" method="get" class="d-inline">
                            <button class="btn btn-sm btn-primary">Detail</button>
                        </form>
                        <form th:action="@{'/employees/' + ${employee.id} + '/edit'}" method="get" class="d-inline">
                            <button class="btn btn-sm btn-warning">Upraviť</button>
                        </form>
                        <form th:action="@{'/employees/' + ${employee.id} + '/delete'}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-danger" onclick="return confirm('Naozaj chcete vymazať tohto zamestnanca?');">Vymazať</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

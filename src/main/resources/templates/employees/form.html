<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulár zamestnanca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${employee.id} != null ? 'Upraviť zamestnanca' : 'Pridať nového zamestnanca'"></h4>
                </div>
                <div class="card-body">
                    <form th:action="${employee.id} != null ? @{/employees/{id}(id=${employee.id})} : @{/employees}" th:object="${employee}" method="post">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Meno</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Priezvisko</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Dátum narodenia</label>
                                <input type="date" class="form-control" th:field="*{birthDate}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Plat (€)</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{salary}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Telefón</label>
                                <input type="tel" class="form-control" th:field="*{phone}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-primary">Pracovná pozícia (Načítané z properties)</label>
                            <select class="form-select" th:field="*{jobTitle}" required>
                                <option value="" disabled selected>Vyberte pozíciu</option>
                                <option th:each="title : ${jobTitles}" th:value="${title}" th:text="${title}"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-primary">Typ úväzku (Načítané z properties)</label>
                            <div class="d-flex gap-4">
                                <div th:each="type : ${jobTypes}" class="form-check">
                                    <input class="form-check-input" type="radio" th:field="*{fullTime}" th:value="${type}" required>
                                    <label class="form-check-label" th:text="${type}"></label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/employees}" class="btn btn-outline-secondary">Späť na zoznam</a>
                            <button type="submit" class="btn btn-primary" th:text="${employee.id} != null ? 'Uložiť zmeny' : 'Vytvoriť zamestnanca'"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

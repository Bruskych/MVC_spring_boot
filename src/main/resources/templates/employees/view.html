<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detail zamestnanca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white text-center">
                    <h4 class="mb-0">Detail zamestnanca</h4>
                </div>
                <div class="card-body">
                    <h3 class="card-title text-center text-primary mb-4" th:text="${employee.firstName + ' ' + employee.lastName}"></h3>

                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item"><strong>Pozícia:</strong> <span th:text="${employee.jobTitle}"></span></li>
                        <li class="list-group-item"><strong>Úväzok:</strong> <span class="badge bg-info text-dark" th:text="${employee.fullTime}"></span></li>
                        <li class="list-group-item"><strong>Dátum narodenia:</strong> <span th:text="${#temporals.format(employee.birthDate, 'dd. MM. yyyy')}"></span></li>
                        <li class="list-group-item"><strong>Email:</strong> <span th:text="${employee.email}"></span></li>
                        <li class="list-group-item"><strong>Telefón:</strong> <span th:text="${employee.phone}"></span></li>
                        <li class="list-group-item"><strong>Plat:</strong> <span th:text="${employee.salary != null ? #numbers.formatDecimal(employee.salary, 1, 'WHITESPACE', 2, 'COMMA') + ' €' : 'Neuvedené'}"></span></li>
                    </ul>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/employees}" class="btn btn-secondary">Späť</a>
                        <div>
                            <form th:action="@{'/employees/' + ${employee.id} + '/edit'}" method="get" class="d-inline">
                                <button class="btn btn-warning">Upraviť</button>
                            </form>
                            <form th:action="@{'/employees/' + ${employee.id} + '/delete'}" method="post" class="d-inline">
                                <button class="btn btn-danger" onclick="return confirm('Naozaj vymazať?');">Vymazať</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
